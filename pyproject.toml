[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "webhook-claim-audit"
version = "0.1.0"
description = "Static audit of documentation against outbound subscriber delivery code"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
webhook-claim-audit = "webhook_claim_audit.cli:main"

[tool.setuptools.packages.find]
include = ["webhook_claim_audit*"]
